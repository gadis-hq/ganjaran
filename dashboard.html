<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GADIS QS HQ Dashboard</title>

<link rel="manifest" href="/ganjaran/manifest.json">
<meta name="theme-color" content="#d4af37">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#fff0f5;
  text-align:center;
}
header{
  background:#d4af37;
  color:white;
  padding:20px;
  font-size:20px;
  font-weight:bold;
}
.card{
  margin:30px auto;
  padding:20px;
  width:90%;
  max-width:500px;
  background:white;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}
button{
  padding:10px 20px;
  background:#d4af37;
  border:none;
  color:white;
  border-radius:8px;
  cursor:pointer;
}
button:hover{
  opacity:0.9;
}
#blurScreen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:9999;
}
</style>
</head>

<body>

<header>GADIS QS HQ – Admin Dashboard</header>

<div class="card">
  <h3>ULTRA ENTERPRISE SYSTEM</h3>
  <p>Status Sistem: <b style="color:green;">AKTIF</b></p>
  <button onclick="alert('Sistem Berfungsi Normal')">Semak Sistem</button>
</div>

<div id="blurScreen"></div>

<script>
/* ===============================
   SERVICE WORKER REGISTER
=============================== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/ganjaran/service-worker.js')
  .then(()=>console.log("SW Ready"))
  .catch(err=>console.log("SW Error:", err));
}

/* ===============================
   ANTI SCREENSHOT + ANTI INSPECT
=============================== */

document.addEventListener("keydown", function(e){
  if(e.key === "PrintScreen"){
    navigator.clipboard.writeText("Screenshot Disabled");
    alert("Screenshot Tidak Dibenarkan");
  }
  if(e.ctrlKey && (e.key === "u" || e.key === "U")){
    e.preventDefault();
  }
  if(e.ctrlKey && e.shiftKey && e.key === "I"){
    e.preventDefault();
  }
});

document.addEventListener("visibilitychange", function(){
  if(document.hidden){
    document.getElementById("blurScreen").style.opacity="1";
  }else{
    document.getElementById("blurScreen").style.opacity="0";
  }
});

setInterval(function(){
  if(window.outerWidth - window.innerWidth > 100){
    document.body.innerHTML="";
  }
},1000);

</script>

</body>
</html>
