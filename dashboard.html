<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GADIS QS HQ Dashboard</title>

<link rel="manifest" href="/ganjaran/manifest.json">
<meta name="theme-color" content="#d4af37">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background: linear-gradient(-45deg, #fff0f5, #fceabb, #fff0f5, #f8d7da);
  background-size: 400% 400%;
  animation: gradientMove 10s ease infinite;
  text-align:center;
  overflow-x:hidden;
}

@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

header{
  background:#d4af37;
  color:white;
  padding:20px;
  font-size:22px;
  font-weight:bold;
  box-shadow:0 0 20px rgba(212,175,55,0.8);
  animation: glow 2s infinite alternate;
}

@keyframes glow{
  from{box-shadow:0 0 10px rgba(212,175,55,0.6);}
  to{box-shadow:0 0 25px rgba(212,175,55,1);}
}

.card{
  margin:30px auto;
  padding:25px;
  width:90%;
  max-width:500px;
  background:white;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  transform:translateY(50px);
  opacity:0;
  animation: slideUp 1s forwards ease;
}

@keyframes slideUp{
  to{
    transform:translateY(0);
    opacity:1;
  }
}

button{
  padding:12px 25px;
  background:#d4af37;
  border:none;
  color:white;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 0 15px rgba(212,175,55,0.7);
}

.counter{
  font-size:30px;
  font-weight:bold;
  color:#d4af37;
  
}
#blurScreen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:9999;
}
/* LOADER */
#loader{
  position:fixed;
  width:100%;
  height:100%;
  background:#111;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:99999;
}

.spinner{
  width:50px;
  height:50px;
  border:5px solid #444;
  border-top:5px solid #d4af37;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg);}
}

/* CARD FLOAT */
.card{
  animation: slideUp 1s forwards ease, float 3s ease-in-out infinite alternate;
}

@keyframes float{
  from{transform:translateY(0);}
  to{transform:translateY(-8px);}
}
.card{
  opacity:0;
  transform:translateY(30px);
  animation:fadeUp 1s forwards, float 4s ease-in-out infinite alternate;
}

@keyframes fadeUp{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes float{
  from{transform:translateY(0);}
  to{transform:translateY(-8px);}
}
    
</style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div id="loader">
  <div class="spinner"></div>
  <p>Loading HQ System...</p>
</div>
  
<header>GADIS QS HQ – Admin Dashboard</header>

<div class="card">
  <h3>ULTRA ENTERPRISE SYSTEM</h3>
  <p>Status Sistem: <b style="color:green;">AKTIF</b></p>
  <p>Total Kod Disemak:</p>
  <div class="counter" id="counter">0</div>
  <br>
  <h2 class="counter" data-target="1250">0</h2>
  <canvas id="myChart" width="300" height="200"></canvas>
  <canvas id="liveChart"></canvas>
  <button onclick="alert('Sistem Berfungsi Normal')">Semak Sistem</button>
</div>

<div id="blurScreen"></div>

<button onclick="lockdown()">LOCKDOWN MODE</button>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>  
<script>
function lockdown(){
    alert("HQ LOCKDOWN AKTIF");
    document.body.innerHTML="<h1 style='color:red;text-align:center;margin-top:50px;'>SYSTEM LOCKED</h1>";
}
</script>

<script>
/* COUNTER ANIMATION */
let count = 0;
let target = 2500; // boleh tukar ikut data sebenar
let speed = 10;

function updateCounter(){
  if(count < target){
    count += 25;
    document.getElementById("counter").innerText = count;
    setTimeout(updateCounter, speed);
  }else{
    document.getElementById("counter").innerText = target;
  }
}
updateCounter();
</script>  
  
<script>
/* ===============================
   HQ LOGIN TOKEN SYSTEM
=============================== */

const HQ_TOKEN = "GADIS-HQ-2026-ULTRA";
const DEVICE_KEY = "hq_device_lock";
const SESSION_KEY = "hq_logged_in";

/* LOGIN CHECK */
function hqLogin(){
    let token = prompt("Masukkan Token HQ:");
    if(token === HQ_TOKEN){
        sessionStorage.setItem(SESSION_KEY,"true");
        lockDevice();
        alert("Akses Dibenarkan");
    }else{
        alert("Token Salah");
        document.body.innerHTML="";
    }
}

/* DEVICE LOCK */
function lockDevice(){
    let fingerprint = navigator.userAgent;
    localStorage.setItem(DEVICE_KEY,fingerprint);
}

/* VERIFY DEVICE */
function verifyDevice(){
    let saved = localStorage.getItem(DEVICE_KEY);
    if(saved && saved !== navigator.userAgent){
        alert("Peranti Tidak Dibenarkan");
        document.body.innerHTML="";
    }
}

/* AUTO LOGOUT (5 minit idle) */
let timeout;
function resetTimer(){
    clearTimeout(timeout);
    timeout = setTimeout(()=>{
        sessionStorage.removeItem(SESSION_KEY);
        alert("Sesi Tamat");
        location.reload();
    },300000);
}

document.addEventListener("mousemove",resetTimer);
document.addEventListener("keydown",resetTimer);

/* INIT */
verifyDevice();
if(!sessionStorage.getItem(SESSION_KEY)){
    hqLogin();
}
</script>  

<script>
/* HIDE LOADER */
window.onload = function(){
  setTimeout(()=>{
    document.getElementById("loader").style.display="none";
  },1200);
};

/* CHART */
const ctx = document.getElementById('myChart').getContext('2d');

new Chart(ctx, {
  type: 'line',
  data: {
    labels: ['Jan','Feb','Mac','Apr','Mei','Jun'],
    datasets: [{
      label: 'Kod Ditebus',
      data: [120,190,300,250,400,520],
      borderColor: '#d4af37',
      backgroundColor: 'rgba(212,175,55,0.2)',
      tension:0.4,
      fill:true
    }]
  },
  options: {
    responsive:true,
    animation:{
      duration:2000
    },
    plugins:{
      legend:{display:false}
    }
  }
});
</script>  
  
<script>
document.querySelectorAll(".counter").forEach(counter=>{
  const updateCount = ()=>{
    const target = +counter.getAttribute("data-target");
    const count = +counter.innerText;
    const increment = target / 200;

    if(count < target){
      counter.innerText = Math.ceil(count + increment);
      setTimeout(updateCount, 15);
    } else {
      counter.innerText = target;
    }
  };
  updateCount();
});
</script> 

  <script>
async function loadChartData(){
  const res = await fetch("https://script.google.com/macros/s/AKfycbw34iaobuZVWwmJ7vlLqOCKzTedVSgwqcYpyPDZiMYUUUqXTLNAFnX7m9TwzZI7RXYh/exec?chart=true");
  const data = await res.json();

  new Chart(document.getElementById('liveChart'), {
    type:'line',
    data:{
      labels:data.labels,
      datasets:[{
        data:data.values,
        borderColor:'#d4af37',
        backgroundColor:'rgba(212,175,55,0.2)',
        tension:0.4,
        fill:true
      }]
    },
    options:{responsive:true}
  });
}

loadChartData();
  </script>
  
<script>
/* ===============================
   SERVICE WORKER REGISTER
=============================== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/ganjaran/service-worker.js')
  .then(()=>console.log("SW Ready"))
  .catch(err=>console.log("SW Error:", err));
}

/* ===============================
   ANTI SCREENSHOT + ANTI INSPECT
=============================== */

document.addEventListener("keydown", function(e){
  if(e.key === "PrintScreen"){
    navigator.clipboard.writeText("Screenshot Disabled");
    alert("Screenshot Tidak Dibenarkan");
  }
  if(e.ctrlKey && (e.key === "u" || e.key === "U")){
    e.preventDefault();
  }
  if(e.ctrlKey && e.shiftKey && e.key === "I"){
    e.preventDefault();
  }
});

document.addEventListener("visibilitychange", function(){
  if(document.hidden){
    document.getElementById("blurScreen").style.opacity="1";
  }else{
    document.getElementById("blurScreen").style.opacity="0";
  }
});

setInterval(function(){
  if(window.outerWidth - window.innerWidth > 100){
    document.body.innerHTML="";
  }
},1000);

</script>

</body>
</html>
