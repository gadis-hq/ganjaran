<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - GADIS QS HQ</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- PWA manifest -->
  <link rel="manifest" href="/ganjaran/manifest.json">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon/icon-512.png">

  <!-- JS -->
  <script src="js/config.js" defer></script>
  <script src="js/dashboard.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <header>
    <h1>GADIS QS HQ</h1>
    <p>Dashboard Ultra Premium</p>
  </header>

  <!-- Live Stats -->
  <section id="live-stats" class="card-premium">
    <h2>📊 Live Stats</h2>
    <div id="stats-content">Loading...</div>
  </section>

  <!-- Heatmap -->
  <section id="heatmap" class="card-premium">
    <h2>🌍 Heatmap Bandar</h2>
    <div id="heatmap-map" style="height:300px;"></div>
  </section>

  <!-- Top 5 Bandar -->
  <section id="top5" class="card-premium">
    <h2>🏆 Top 5 Bandar</h2>
    <ol id="top5-list">Loading...</ol>
  </section>

  <!-- LED Stage Mode -->
  <section id="led-stage" class="card-premium">
    <h2>💡 LED Stage Mode</h2>
    <div id="led-display">Memaparkan animasi LED...</div>
  </section>

  <!-- Confetti -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 GADIS QS HQ</p>
  </footer>

  <!-- JS Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>

  <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/ganjaran/service-worker.js')
    .then(() => console.log("SW Registered"))
    .catch(err => console.log("SW Error:", err));
}
 
    // Confetti function
    function triggerConfetti() {
      confetti({
        particleCount: 120,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#ff99cc','#d4af37','#fff0f5']
      });
    }

    // Badge warna
    function updateStatusBadge(status) {
      const badge = document.createElement('span');
      badge.classList.add('btn-premium');
      if(status === 'TELAH DITEBUS') badge.style.backgroundColor = '#d4af37';
      else if(status === 'BELUM DITEBUS') badge.style.backgroundColor = '#28a745';
      else badge.style.backgroundColor = '#dc3545';
      badge.innerText = status;
      return badge;
    }

    // Simulasi live stats + heatmap
    document.addEventListener('DOMContentLoaded', () => {
      // Live Stats
      const stats = document.getElementById('stats-content');
      stats.innerHTML = `
        <p>Jumlah Kod Sah: 120</p>
        <p>Jumlah Kod Telah Ditebus: 85</p>
        <p>Jumlah Kod Belum Ditebus: 35</p>
      `;

      // Top 5 Bandar
      const top5List = document.getElementById('top5-list');
      const top5 = ['Kuala Lumpur','Johor Bahru','Penang','Ipoh','Kota Bharu'];
      top5List.innerHTML = '';
      top5.forEach(b => {
        const li = document.createElement('li');
        li.innerText = b;
        top5List.appendChild(li);
      });

      // Heatmap placeholder
      const map = document.getElementById('heatmap-map');
      map.innerHTML = '<p style="text-align:center; padding-top:120px;">[Heatmap Bandar akan dipaparkan di sini]</p>';

      // LED Stage placeholder
      const led = document.getElementById('led-display');
      led.innerHTML = '<p style="text-align:center;">Animasi LED aktif</p>';
    });
  </script>
</body>
</html>
