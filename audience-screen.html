<link rel="stylesheet" href="css/style.css">

<style>
body{
  margin:0;
  background:black;
  overflow:hidden;
  color:white;
  text-align:center;
}

/* 🔥 Stage Light Animation */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,215,0,0.3), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(255,0,150,0.3), transparent 40%);
  animation: stageMove 8s infinite alternate;
  z-index:-1;
}

@keyframes stageMove{
  from{transform:translate(-10%,-10%) rotate(0deg);}
  to{transform:translate(10%,10%) rotate(10deg);}
}

.winner-name{
  font-size:80px;
  margin-top:120px;
  text-transform:uppercase;
  text-shadow:
    3px 3px 0 gold,
    6px 6px 15px rgba(255,215,0,0.8);
  animation: pop3d 1s ease-out;
}

.counter{
  font-size:35px;
  margin-top:40px;
  color:#00ffcc;
}

@keyframes pop3d{
  from{transform:scale(0.5); opacity:0;}
  to{transform:scale(1); opacity:1;}
}
</style>

<h1>🎉 TAHNIAH PEMENANG 🎉</h1>

<div id="winnerName" class="winner-name"></div>
<div id="statusMessage"></div>
<div class="counter">
  Jumlah Scan Global Hari Ini: <span id="scanCount">0</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script type="module" src="js/audience.js"></script>
