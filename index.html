<script>
const API = "YOUR_WEBAPP_URL";

const map = L.map('map').setView([4.5,109],6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

let geoLayer;
let markerLayer = L.layerGroup().addTo(map);

function getColor(value){
  return value > 50 ? '#7f0000' :
         value > 30 ? '#b30000' :
         value > 20 ? '#d7301f' :
         value > 10 ? '#ef6548' :
         value > 5  ? '#fc8d59' :
         value > 1  ? '#fdbb84' :
                      '#fee8c8';
}

async function loadHeatmap(){

  const res = await fetch(API + "?type=heatmap");
  const data = await res.json();

  if(geoLayer) map.removeLayer(geoLayer);
  markerLayer.clearLayers();

  const geoRes = await fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries/MYS.geo.json");
  const geoData = await geoRes.json();

  geoLayer = L.geoJSON(geoData, {

    style: function(feature){
      const negeri = feature.properties.name.toUpperCase();
      const count = data.negeri[negeri] ? data.negeri[negeri].count : 0;

      return {
        fillColor: getColor(count),
        weight:1,
        color:'#ffffff',
        fillOpacity:0.8
      };
    },

    onEachFeature: function(feature, layer){
      const negeri = feature.properties.name.toUpperCase();
      const info = data.negeri[negeri];

      if(info){

        let senarai = "<ul>";
        info.names.forEach(n=>{
          senarai += "<li>"+n+"</li>";
        });
        senarai += "</ul>";

        layer.bindPopup(
          "<strong>"+negeri+"</strong><br>" +
          "Jumlah SAH: "+info.count+
          "<hr>"+senarai
        );

      }
    }

  }).addTo(map);

  /* ===== Heatmap Bandar ===== */
  <script>
const API = "YOUR_WEBAPP_URL";

const map = L.map('map').setView([4.5,109],6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

let heatLayer;

async function loadCityHeatmap(){

  const res = await fetch(API + "?type=heatmapCity");
  const bandarData = await res.json();

  if(heatLayer) map.removeLayer(heatLayer);

  let heatPoints = [];

  for(const bandar in bandarData){

    const count = bandarData[bandar];

    // Geocode bandar → dapatkan lat/lon
    const geo = await fetch(
      "https://nominatim.openstreetmap.org/search?format=json&q="+bandar+", Malaysia"
    );
    const loc = await geo.json();

    if(loc && loc[0]){
      heatPoints.push([
        parseFloat(loc[0].lat),
        parseFloat(loc[0].lon),
        count
      ]);
    }
  }

  heatLayer = L.heatLayer(heatPoints,{
    radius:25,
    blur:20,
    maxZoom:10
  }).addTo(map);

}

loadCityHeatmap();
setInterval(loadCityHeatmap,30000);

  /* ===== MARKER ANIMASI ===== */
  data.markers.forEach(m=>{

    fetch("https://nominatim.openstreetmap.org/search?format=json&q="+m.lokasi)
    .then(r=>r.json())
    .then(loc=>{

      if(loc && loc[0]){
        const lat = loc[0].lat;
        const lon = loc[0].lon;

        const marker = L.circleMarker([lat,lon],{
          radius:8,
          color:"#d4af37",
          fillColor:"#ff1493",
          fillOpacity:0.9
        });

        marker.bindPopup("<strong>"+m.nama+"</strong><br>"+m.lokasi);

        marker.addTo(markerLayer);

        setTimeout(()=>{
          marker.setRadius(14);
          setTimeout(()=>marker.setRadius(8),400);
        },500);

      }

    });

  });

}

loadHeatmap();
setInterval(loadHeatmap,20000);
</script>

<script>
let deferredPrompt;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'inline-block';
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;

  deferredPrompt.prompt();

  const { outcome } = await deferredPrompt.userChoice;
  console.log(`User response: ${outcome}`);

  deferredPrompt = null;
  installBtn.style.display = 'none';
});

window.addEventListener('appinstalled', () => {
  console.log('App berjaya dipasang');
  installBtn.style.display = 'none';
});
    
    // Badge warna auto (contoh)
    function updateStatusBadge(status) {
      const badge = document.createElement('span');
      badge.classList.add('btn-premium');
      if(status === 'TELAH DITEBUS') badge.style.backgroundColor = '#d4af37'; // emas
      else if(status === 'BELUM DITEBUS') badge.style.backgroundColor = '#28a745'; // hijau
      else badge.style.backgroundColor = '#dc3545'; // merah
      badge.innerText = status;
      return badge;
    }

    // Confetti trigger example
    function triggerConfetti() {
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#ff99cc','#d4af37','#fff0f5']
      });
    }
  </script>
