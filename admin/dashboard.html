<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>HQ Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Leaflet (Free Map Mode) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
</head>
<body>

<header>
  <h1>HQ LIVE DASHBOARD</h1>
  <button onclick="eventMode()">🎬 Event Mode</button>
</header>

<section class="stats">
  <div class="card">
    <h3>Kod Sah</h3>
    <p id="totalSah">0</p>
  </div>

  <div class="card">
    <h3>Kod Ditebus</h3>
    <p id="totalTebus">0</p>
  </div>

  <div class="card">
    <h3>Belum Tebus</h3>
    <p id="totalBelum">0</p>
  </div>
</section>

<section>
  <canvas id="liveChart" height="100"></canvas>
</section>

<section class="map-section">
  <button onclick="switchMap('google')">Google Map</button>
  <button onclick="switchMap('osm')">OpenStreetMap</button>

  <div id="googleMap"></div>
  <div id="osmMap"></div>
</section>

<div id="winnerPopup"></div>

<!-- Audio -->
<audio id="notifySound" src="sound/notify.mp3"></audio>

<!-- Google Maps (letak API key sendiri) -->
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=visualization&callback=initGoogleMap" async defer></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Script utama -->
<script src="admin.js"></script>

</body>
</html>
