<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard – GADIS QS</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<h1>📊 ADMIN HQ DASHBOARD</h1>

<div class="stats">
  <div class="card">
    <h3>Total Kod</h3>
    <p id="totalKod">0</p>
  </div>
  <div class="card">
    <h3>Kod Ditebus</h3>
    <p id="redeemKod">0</p>
  </div>
  <div class="card">
    <h3>Bandar Aktif</h3>
    <p id="bandarAktif">0</p>
  </div>
</div>

<h2>📍 Heatmap Bandar</h2>
<div id="heatmap"></div>

<h2>🧾 Senarai Tebusan</h2>
<table id="redeemTable">
<thead>
<tr>
<th>Nama</th>
<th>Kod</th>
<th>Bandar</th>
<th>Tarikh</th>
<th>Tindakan</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script src="admin.js"></script>

</body>
</html>
