<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Verification</title>
</head>
<body style="font-family:Arial;text-align:center;padding:40px;background:#fff0f5">

<h2>QR Verification</h2>
<div id="result">Memproses...</div>

<script>
const params = new URLSearchParams(window.location.search);
const code = params.get("code");
const token = params.get("token");

fetch("https://script.google.com/macros/s/AKfycby6m-F4D2RN7C8l2e7n_gZuvOrBeAkDhIlu6s5LCS_kDp3QWl9_iQw_1xdZ1srMVuQL/exec?mode=verify&code="+code+"&token="+token)
.then(res=>res.json())
.then(data=>{

if(!data.success){
  document.getElementById("result").innerHTML =
  "<b style='color:red'>Kod Tidak Sah</b>";
  return;
}

if(data.status_penebusan==="TELAH DITEBUS"){
  document.getElementById("result").innerHTML =
  "<b style='color:green'>SAH & TELAH DITEBUS</b><br>"+
  data.nama+"<br>"+data.negeri;
}

if(data.status_penebusan==="AKTIF BELUM DITEBUS"){
  document.getElementById("result").innerHTML =
  "<b style='color:orange'>SAH & MASIH AKTIF</b>";
}

});
</script>

  <script type="module">
import { CONFIG } from "./js/config.js";
import { callAPI } from "./js/api.js";

const p = new URLSearchParams(window.location.search);
const code = p.get("code");
const token = p.get("token");

callAPI(`?mode=verify&code=${code}&token=${token}`)
.then(data=>{

  if(!data.success){
    document.getElementById("result")
    .innerHTML="<div class='error'>Tidak Sah</div>";
    return;
  }

  // Simpan untuk audience screen
  localStorage.setItem("winnerData", JSON.stringify(data));

  setTimeout(()=>{
    window.location.href="audience-screen.html";
  },1000);

});
</script> 

</body>
</html>
